server:
  port: 8300
  host: "127.0.0.1"
  cors:
    origins: ["http://localhost:5300"]

dashboard:
  port: 5300
  host: "127.0.0.1"

database:
  path: "./data/cliproxy.db"

auth:
  enabled: true
  admin_token: "${ADMIN_TOKEN}"
  initial_keys:
    - name: "default"
      key: "${PROXY_API_KEY}"

providers:
  claude:
    enabled: true
    cli_path: "claude"
    default_model: "claude-sonnet-4-6"
    max_concurrent: 10
    timeout_ms: 300000
    extra_args:
      - "--no-session-persistence"
      - "--permission-mode"
      - "bypassPermissions"
    # working_dir: "/path/to/project"
    # mode: "sdk"                      # 'cli' (default) | 'sdk' (Agent SDK)
    # sdk_options:
    #   max_turns: 50
    #   permission_mode: "bypassPermissions"
    #   allowed_tools: []
    #   disallowed_tools: []
    #   max_budget_usd: 1.0
    #   session_ttl_ms: 1800000
    #   enable_session_reuse: true
    #   persist_session: false
    #
    # mode: "channel-worker"           # Submits jobs to running Claude Code Channel bridge
    # channel_options:
    #   endpoint_url: "http://127.0.0.1:8788"
    #   poll_interval_ms: 500
    #   result_timeout_ms: 300000
    #   isolation: "external"          # Recommended one-job-per-worker for API independence
    #   managed: true                  # cliproxy spawns and supervises internal bridge process
    #   auto_start: true
    #   bridge_port: 8788
    #   # bridge_command: "node my-bridge.js"

  codex:
    enabled: true
    cli_path: "codex"
    default_model: "gpt-5.5"
    max_concurrent: 10
    timeout_ms: 300000
    extra_args:
      - "--skip-git-repo-check"
      - "--sandbox"
      - "workspace-write"
    cli_options:
      ephemeral: true                # Injects --ephemeral to prevent ~/.codex/sessions/*.jsonl accumulation
      # enable_session_reuse: false  # Reuses sessions via codex exec resume <thread_id>. Forces ephemeral=false.
      # session_ttl_ms: 1800000      # Valid only when enable_session_reuse is true
    # working_dir: "/path/to/project"
    # mode: "app-server"              # 'cli' (default) | 'app-server' (persistent JSON-RPC)
    # app_server_options:
    #   transport: "stdio"
    #   session_ttl_ms: 1800000
    #   enable_session_reuse: true
    #   max_turns: 10
    #   auto_restart: true
    #   max_restart_count: 5

  copilot:
    enabled: true
    cli_path: "copilot"
    default_model: "claude-sonnet-4-6"
    max_concurrent: 10
    timeout_ms: 300000
    extra_args:
      - "--deny-tool=shell"
      - "--deny-tool=write"
    # working_dir: "/path/to/project"
    # Requires COPILOT_GITHUB_TOKEN env var or prior 'copilot' OAuth login.

  # Gemini CLI is deprecated in favor of Antigravity CLI (agy).
  # Explicitly disabled because omitting built-ins defaults them to enabled.
  gemini:
    enabled: false
    # cli_path: "gemini"
    # default_model: "gemini-2.5-pro"
    # max_concurrent: 10
    # timeout_ms: 300000
    # extra_args:
    #   - "--yolo"                       # Auto-approve tools in headless mode
    #   - "--skip-trust"                 # Prevent trusted folder prompts in headless mode
    # working_dir: "/path/to/project"

  # Google Antigravity CLI (agy)
  # Requires Google OAuth login via system keychain (or auth URL in SSH sessions).
  # default_model "antigravity" is a placeholder: omitting --model lets agy auto-select.
  agy:
    enabled: true
    cli_path: "agy"
    default_model: "antigravity"
    max_concurrent: 5                   # Conservative default to protect quota
    timeout_ms: 300000
    extra_args: []
    # extra_args:
    #   - "--dangerously-skip-permissions"  # Auto-approve tools in headless mode
    #   - "--sandbox"
    # working_dir: "/path/to/safe-workspace"

  # xAI Grok Build CLI (grok)
  # Requires SuperGrok / X Premium+ login via `grok login`.
  # Prompts exceeding 800KB are passed via --prompt-file to bypass OS ARG_MAX limits.
  grok:
    enabled: true
    cli_path: "grok"
    default_model: "grok-4.5"
    max_concurrent: 5                   # Conservative default to protect quota
    timeout_ms: 300000
    extra_args: []
    # extra_args:
    #   - "--always-approve"
    # working_dir: "/path/to/safe-workspace"

  # Moonshot AI Kimi Code CLI (kimi)
  # Injects KIMI_CODE_NO_AUTO_UPDATE=1 to prevent self-updates during requests.
  # Token usage is estimated from UTF-8 byte length because the CLI does not output tokens.
  kimi:
    enabled: true
    cli_path: "kimi"
    default_model: "kimi-code/kimi-for-coding"
    max_concurrent: 5
    timeout_ms: 300000
    extra_args: []
    # working_dir: "/path/to/isolated-workspace"

  # OpenCode CLI (`opencode`)
  # Headless non-interactive execution with JSON output.
  opencode:
    enabled: true
    cli_path: "opencode"
    default_model: "opencode/muse-spark-1.3-contributor-free"
    max_concurrent: 5
    timeout_ms: 300000
    extra_args: []

# Tool Bridge Provider (opt-in)
# Wraps non-tool-calling CLIs with structured output for OpenAI tool_calls without requiring SDK/app-server.
# Native tools are disabled; client function definitions are converted and returned as tool_calls.
# AGY is unsupported because it lacks a flag to disable native tools entirely.
# tool_bridge_providers:
#   claude-tools:
#     base_provider: "claude"
#     driver: "claude-cli"
#     strategy: "structured-output"
#     disable_native_tools: true
#     max_concurrent: 2
#     timeout_ms: 300000
#   codex-tools:
#     enabled: true
#     base_provider: "codex"
#     driver: "codex-cli"
#     strategy: "structured-output"
#     disable_native_tools: true
#     max_concurrent: 2
#   grok-tools:
#     base_provider: "grok"
#     driver: "grok-cli"
#     strategy: "structured-output"
#     disable_native_tools: true
#     max_concurrent: 2

# Plugins: add custom providers without modifying server source code.
plugins: []
  # - path: "./plugins/example-plugin"
  #   config:
  #     cli_path: "/usr/local/bin/my-cli"
  #     default_model: "my-model"
  #     max_concurrent: 10
  #     timeout_ms: 120000

rate_limits:
  global:
    rpm: 60
    rpd: 1000
  per_provider:
    claude:
      rpm: 20
    codex:
      rpm: 20
    copilot:
      rpm: 20
    agy:
      rpm: 20
    grok:
      rpm: 20
    kimi:
      rpm: 20
    opencode:
      rpm: 20
    # claude-tools:
    #   rpm: 10
    # grok-tools:
    #   rpm: 10
    # codex-tools:
    #   rpm: 10

cache:
  enabled: true
  ttl_seconds: 3600
  max_entries: 1000

validation:
  max_message_count: 800
  max_message_length: 250000
  max_prompt_length: 1000000
  max_response_length: 300000
  body_limit_bytes: 16777216

model_mappings:
  # reasoning_effort (optional): low | medium | high | xhigh | max
  #   - Claude  : --effort <level>
  #   - Codex   : -c model_reasoning_effort (falls back to high for xhigh/max)
  #   - Copilot : --effort <level> (falls back to xhigh for max)
  #   - Kimi K3 : KIMI_MODEL_THINKING_EFFORT (low/high/max)
  # Applies to CLI mode only.
  #
  # provider_overrides (optional): whitelist-based overrides per mapping.
  #   Allowed: extra_args, timeout_ms, working_dir, cli_options.{ephemeral, enable_session_reuse, session_ttl_ms}
  #   Forbidden: cli_path, enabled, default_model, max_concurrent, app_server_options
  #   Example:
  #     provider_overrides:
  #       cli_options:
  #         enable_session_reuse: true
  #         session_ttl_ms: 3600000
  #       extra_args: ["--skip-git-repo-check"]

  # Claude models
  - alias: "claude-sonnet"
    provider: "claude"
    actual_model: "claude-sonnet-4-6"
  - alias: "claude-haiku"
    provider: "claude"
    actual_model: "claude-haiku-4-5-20251001"
  # - alias: "claude-tools"
  #   provider: "claude-tools"
  #   actual_model: "claude-sonnet-4-6"
  # - alias: "codex-tools"
  #   provider: "codex-tools"
  #   actual_model: "gpt-5.5"
  # - alias: "grok-tools"
  #   provider: "grok-tools"
  #   actual_model: "grok-4.5"
  # Codex/OpenAI models
  - alias: "gpt-5.5"
    provider: "codex"
    actual_model: "gpt-5.5"
  - alias: "gpt-5.4-mini"
    provider: "codex"
    actual_model: "gpt-5.4-mini"
  # Copilot models
  - alias: "copilot-sonnet"
    provider: "copilot"
    actual_model: "claude-sonnet-4-6"
  - alias: "copilot-gpt"
    provider: "copilot"
    actual_model: "gpt-5.4"
  # Antigravity (agy)
  - alias: "antigravity"
    provider: "agy"
    actual_model: "antigravity"          # Placeholder: omitting --model lets agy auto-select
  - alias: "gemini-3.6-flash-high"
    provider: "agy"
    actual_model: "gemini-3.6-flash"
    reasoning_effort: "high"

  # xAI Grok Build
  - alias: "grok-4.5"
    provider: "grok"
    actual_model: "grok-4.5"

  # Moonshot AI Kimi Code: actual_model is the CLI model alias
  - alias: "kimi-k3"
    provider: "kimi"
    actual_model: "kimi-code/k3"
  - alias: "kimi-coding"
    provider: "kimi"
    actual_model: "kimi-code/kimi-for-coding"

  # OpenCode CLI — free models
  - alias: "opencode-free"
    provider: "opencode"
    actual_model: "opencode/muse-spark-1.3-contributor-free"
